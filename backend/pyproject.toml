[project]
name = "userside-map"
version = "0.1.0"
description = "Versioned Userside to PostGIS synchronization"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary,pool]>=3.2,<4",
    "python-dotenv>=1,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "redis>=6.4,<7",
    "boto3>=1.40,<2",
]

[project.scripts]
map-db = "map_sync.cli:main"
map-api = "map_api.cli:main"
map-token = "map_api.token_cli:main"
map-tiles = "map_tiles.cli:main"

[project.optional-dependencies]
tiles = [
    "cairocffi==1.7.1",
    "mapbox-vector-tile==2.2.0",
    "pillow==12.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["map_sync", "map_api", "map_render", "map_tiles"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9",
    "httpx>=0.27,<1",
    "mapbox-vector-tile>=2.2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
